<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mi lista de tareas</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="app">
    <header>
      <h1>Mi lista de tareas</h1>
      <p id="counter" class="counter" aria-live="polite">Cargando…</p>
    </header>

    <form id="add-form" class="add-form" autocomplete="off">
      <label for="new-title" class="visually-hidden">Nueva tarea</label>
      <input id="new-title" name="title" type="text" maxlength="100" placeholder="¿Qué necesitas hacer?" required>
      <button type="submit" class="primary">Agregar</button>
    </form>

    <p id="message" class="message" role="status" aria-live="polite"></p>

    <nav class="filters" aria-label="Filtrar tareas">
      <button type="button" data-filter="all" aria-pressed="true">Todas</button>
      <button type="button" data-filter="active" aria-pressed="false">Pendientes</button>
      <button type="button" data-filter="completed" aria-pressed="false">Completadas</button>
    </nav>

    <ul id="task-list" class="task-list"></ul>
    <p id="empty" class="empty" hidden>No hay tareas aquí. ¡Agrega la primera!</p>
  </main>

  <script src="/shared/todo.js"></script>
  <script src="/app.js"></script>
</body>
</html>
